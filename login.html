<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – LeadFlow</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0f172a; color:#e2e8f0; }
    .login-box { background:#1e293b; padding:2.5rem; border-radius:12px; width:90%; max-width:420px; border:1px solid #334155; }
    h1 { text-align:center; margin-bottom:1.5rem; }
    select, input { width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white; font-size:1rem; }
    button { width:100%; padding:1rem; margin-top:1rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; }
    button:hover { background:#2563eb; }
    .back { display:block; text-align:center; margin-top:1.5rem; color:#94a3b8; }
  </style>
</head>
<body>

<div class="login-box">
  <h1>Login to LeadFlow</h1>
  <label>I am:</label>
  <select id="role">
    <option value="admin">Business Owner / Admin</option>
    <option value="customer">Client / Customer</option>
  </select>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@yourbusiness.co.za" value="demo@leadflow.co.za">

  <button onclick="handleLogin()">Login</button>

  <a href="../index.html" class="back">← Back to home</a>
</div>

<script>
function handleLogin() {
  const role = document.getElementById('role').value;
  const email = document.getElementById('email').value.trim();

  if (!email) {
    alert("Please enter an email");
    return;
  }

  localStorage.setItem('leadflow_role', role);
  localStorage.setItem('leadflow_email', email);

  if (role === 'admin') {
    window.location.href = 'admin/index.html';
  } else {
    window.location.href = 'customer/index.html';
  }
}
</script>

</body>
</html>
