<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Register – LeadFlow</title>
  <style>
    body { font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .box { background:#1e293b; padding:2.5rem; border-radius:12px; width:90%; max-width:400px; border:1px solid #334155; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    h1 { text-align:center; margin-bottom:1.5rem; }
    .tabs { display:flex; margin-bottom:1.5rem; border-bottom:1px solid #334155; }
    .tab { flex:1; padding:0.8rem; text-align:center; cursor:pointer; font-weight:600; border-bottom:3px solid transparent; }
    .tab.active { border-bottom:3px solid #3b82f6; color:#3b82f6; }
    input { width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155; }
    button { width:100%; padding:1rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; margin-top:1rem; }
    button:hover { background:#2563eb; }
    .message { margin-top:1rem; text-align:center; font-weight:500; }
    .switch { text-align:center; margin:1rem 0; color:#94a3b8; cursor:pointer; }
  </style>
</head>
<body>

<div class="box">
  <h1>LeadFlow</h1>

  <div class="tabs">
    <div class="tab active" data-tab="login">Login</div>
    <div class="tab" data-tab="signup">Register (Free Trial)</div>
  </div>

  <div id="loginSection">
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" value="demo@leadflow.co.za">
      <input type="password" id="loginPassword" placeholder="Password" value="demo123">
      <button type="submit">Login</button>
    </form>
  </div>

  <div id="signupSection" style="display:none;">
    <form id="signupForm">
      <input type="email" id="regEmail" placeholder="Email" value="newuser@leadflow.co.za">
      <input type="password" id="regPassword" placeholder="Password (6+ chars)" value="demo123">
      <input type="password" id="regConfirm" placeholder="Confirm Password" value="demo123">
      <button type="submit">Create Free Trial Account</button>
    </form>
  </div>

  <div class="switch" id="switchBtn">Don't have an account? Register here</div>
  <div id="message" class="message"></div>
</div>

<script>
  const message = document.getElementById('message');
  const switchBtn = document.getElementById('switchBtn');

  let isLogin = true;

  // Tab switching
  switchBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    document.getElementById('loginSection').style.display = isLogin ? 'block' : 'none';
    document.getElementById('signupSection').style.display = isLogin ? 'none' : 'block';
    switchBtn.textContent = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
  });

  // LOGIN
  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;

    // Magic admin password
    if (email === "admin@leadflow.co.za" && pass === "admin2026") {
      localStorage.setItem('role', 'admin');
      message.innerHTML = '<span style="color:#22c55e">Admin access granted!</span>';
      setTimeout(() => window.location.href = 'admin/index.html', 800);
      return;
    }

    localStorage.setItem('role', 'customer');
    message.innerHTML = '<span style="color:#22c55e">Logged in! Redirecting...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 800);
  });

  // REGISTER
  document.getElementById('signupForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    if (pass !== confirm) {
      message.textContent = 'Passwords do not match';
      return;
    }

    localStorage.setItem('role', 'free_trial');
    message.innerHTML = '<span style="color:#22c55e">Free trial activated! Redirecting to customer dashboard...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 1200);
  });
</script>
</body>
</html>
