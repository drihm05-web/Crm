<html lang="en" data-theme="dark">

  <meta charset="UTF-8" />

    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

      'https://vrmunobrlrmsucywsolq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybXVub2JybHJtc3VjeXdzb2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODE2MzUsImV4cCI6MjA4OTM1NzYzNX0.ZljzOKl49ENCnmN_WT0eF9W6J_-AeA4FVcs_pTI04ms'
    );
  </script>
  <style>
    body { font-family:system-ui; background:#0f172a; color:#e2e8f0; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .box { background:#1e293b; padding:2.5rem; border-radius:12px; width:90%; max-width:400px; border:1px solid #334155; }
    h1 { text-align:center; margin-bottom:1.5rem; }
    input { width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155; }
    button { width:100%; padding:1rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; margin:0.5rem 0; }
    button:hover { background:#2563eb; }
    .switch { text-align:center; margin:1rem 0; color:#94a3b8; cursor:pointer; }
    .message { text-align:center; margin-top:1rem; font-weight:500; min-height:24px; }
  </style>
</head>
<body>

<div class="box">
  <h1>LeadFlow</h1>

  <div id="loginBox">
    <input type="email" id="loginEmail" placeholder="Email" value="test@leadflow.co.za">
    <input type="password" id="loginPassword" placeholder="Password" value="123456">
    <button onclick="handleLogin()">Login</button>
  </div>

  <div id="registerBox" style="display:none;">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password (min 6)">
    <input type="password" id="regConfirm" placeholder="Confirm Password">
    <button onclick="handleRegister()">Create Free Trial Account</button>
  </div>

  <div class="switch" id="switchBtn">Don't have an account? Click here to Register</div>
  <div id="message" class="message"></div>
</div>

<script type="module">
  console.log("✅ Login page loaded");

  const message = document.getElementById('message');
  const switchBtn = document.getElementById('switchBtn');

  let isLogin = true;

  switchBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    document.getElementById('loginBox').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerBox').style.display = isLogin ? 'none' : 'block';
    switchBtn.textContent = isLogin ? "Don't have an account? Click here to Register" : "Already have an account? Click here to Login";
    console.log("Tab switched to", isLogin ? "login" : "register");
  });

  window.handleLogin = async () => {
    console.log("Login button clicked");
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;

    message.textContent = "Checking...";

    // MAGIC ADMIN PASSWORD
    if (email === "admin@leadflow.co.za" && pass === "admin2026") {
      console.log("Magic admin password used");
      localStorage.setItem('role', 'admin');
      message.innerHTML = '<span style="color:#22c55e">Admin access granted! Redirecting...</span>';
      setTimeout(() => window.location.href = 'admin/index.html', 800);
      return;
    }

    console.log("Trying Supabase login for", email);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });

    if (error) {
      console.error("Login error:", error);
      message.innerHTML = `<span style="color:#ef4444">${error.message}</span>`;
      return;
    }

    console.log("Login successful");
    localStorage.setItem('role', 'customer');
    message.innerHTML = '<span style="color:#22c55e">Login successful! Redirecting...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 800);
  };

  window.handleRegister = async () => {
    console.log("Register button clicked");
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    if (pass !== confirm) {
      message.textContent = "Passwords do not match";
      return;
    }

    message.textContent = "Creating free trial...";

    const { error } = await supabase.auth.signUp({
      email,
      password: pass,
      options: { data: { role: 'free_trial' } }
    });

    if (error) {
      console.error("Register error:", error);
      message.innerHTML = `<span style="color:#ef4444">${error.message}</span>`;
      return;
    }

    console.log("Register successful");
    localStorage.setItem('role', 'free_trial');
    message.innerHTML = '<span style="color:#22c55e">Free trial created! Redirecting to dashboard...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 1200);
  };
</script>
</body>
</html>
