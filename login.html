<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    window.supabase = createClient(
      'https://vrmunobrlrmsucywsolq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZybXVub2JybHJtc3VjeXdzb2xxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3ODE2MzUsImV4cCI6MjA4OTM1NzYzNX0.ZljzOKl49ENCnmN_WT0eF9W6J_-AeA4FVcs_pTI04ms'
    );
  </script>
  <style>
    body { font-family: system-ui; background: #0f172a; color: #e2e8f0; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .box { background:#1e293b; padding:2.5rem; border-radius:12px; width:90%; max-width:400px; border:1px solid #334155; }
    h1 { text-align:center; margin-bottom:1.5rem; }
    input { width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:8px; background:#0f172a; color:white; border:1px solid #334155; }
    button { width:100%; padding:1rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; margin-top:1rem; }
    button:hover { background:#2563eb; }
    .switch { text-align:center; margin:1rem 0; color:#94a3b8; cursor:pointer; }
    .message { text-align:center; margin-top:1rem; font-weight:500; }
  </style>
</head>
<body>

<div class="box">
  <h1>LeadFlow</h1>

  <!-- LOGIN FORM -->
  <div id="loginBox">
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerBox" style="display:none;">
    <form id="registerForm">
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password (min 6)" required minlength="6">
      <input type="password" id="regConfirm" placeholder="Confirm Password" required>
      <button type="submit">Create Free Trial Account</button>
    </form>
  </div>

  <div class="switch" id="switchBtn">Don't have an account? Register here</div>
  <div id="message" class="message"></div>
</div>

<script type="module">
  const message = document.getElementById('message');
  const switchBtn = document.getElementById('switchBtn');

  // Toggle between login & register
  let isLogin = true;
  switchBtn.addEventListener('click', () => {
    isLogin = !isLogin;
    document.getElementById('loginBox').style.display = isLogin ? 'block' : 'none';
    document.getElementById('registerBox').style.display = isLogin ? 'none' : 'block';
    switchBtn.textContent = isLogin ? "Don't have an account? Register here" : "Already have an account? Login here";
    message.textContent = '';
  });

  // LOGIN
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;

    // MAGIC ADMIN PASSWORD
    if (email === "admin@leadflow.co.za" && pass === "admin2026") {
      localStorage.setItem('role', 'admin');
      message.innerHTML = '<span style="color:#22c55e">Admin access granted!</span>';
      setTimeout(() => window.location.href = 'admin/index.html', 800);
      return;
    }

    message.textContent = 'Logging in...';
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });

    if (error) {
      message.innerHTML = `<span style="color:#ef4444">${error.message}</span>`;
      return;
    }

    localStorage.setItem('role', 'customer');
    message.innerHTML = '<span style="color:#22c55e">Welcome back! Redirecting...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 800);
  });

  // REGISTER (Free Trial)
  document.getElementById('registerForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;

    if (pass !== confirm) return message.textContent = 'Passwords do not match';
    if (pass.length < 6) return message.textContent = 'Password must be at least 6 characters';

    message.textContent = 'Creating free trial account...';

    const { error } = await supabase.auth.signUp({
      email,
      password: pass,
      options: { data: { role: 'free_trial' } }
    });

    if (error) {
      message.innerHTML = `<span style="color:#ef4444">${error.message}</span>`;
      return;
    }

    localStorage.setItem('role', 'free_trial');
    message.innerHTML = '<span style="color:#22c55e">Free trial activated! Redirecting to dashboard...</span>';
    setTimeout(() => window.location.href = 'customer/index.html', 1200);
  });

  console.log("✅ Login page loaded – click Register or Login to test");
</script>
</body>
</html>
