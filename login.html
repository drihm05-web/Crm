  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; margin-bottom: 1.5rem; }
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #334155;
    }
    .tab {
      flex: 1;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      border-bottom: 3px solid #3b82f6;
      color: #3b82f6;
    }
    .tab:hover { background: rgba(59,130,246,0.1); }
    input {
      width: 100%;
      padding: 0.9rem;
      margin: 0.6rem 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
      min-height: 1.2rem;
    }
    .error { color: #ef4444; }
    .success { color: #22c55e; }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
    }
    .form-section { display: none; }
    .form-section.active { display: block; }
  </style>
</head>
<body>

<div class="container">
  <h1>LeadFlow</h1>

  <div class="tabs">
    <div class="tab active" data-form="login">Login</div>
    <div class="tab" data-form="signup">Register</div>
  </div>

  <div id="loginForm" class="form-section active">
    <form id="loginFormElement">
      <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Login</button>
    </form>
  </div>

  <div id="signupForm" class="form-section">
    <form id="signupFormElement">
      <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
      <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password">
      <input type="password" id="signupPasswordConfirm" placeholder="Confirm Password" required minlength="6">
      <button type="submit">Create Account</button>
    </form>
  </div>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">← Back to home</a>
</div>

<script type="module">
  const messageDiv = document.getElementById('message');

  function showMessage(text, type = 'info') {
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + type;
  }

  // Tab switching (using data attributes - more reliable)
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      // Remove active from all tabs
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      // Hide all forms
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

      // Show correct form
      const formId = tab.dataset.form === 'login' ? 'loginForm' : 'signupForm';
      document.getElementById(formId).classList.add('active');

      showMessage(''); // clear previous messages
    });
  });

  // ────────────────────────────────────────────────
  //                  LOGIN HANDLER
  // ────────────────────────────────────────────────
  document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) return showMessage('Please fill in all fields', 'error');

    showMessage('Logging in...', 'info');

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage(error.message || 'Login failed – check credentials', 'error');
      console.error('Login error:', error);
      return;
    }

    localStorage.setItem('access_token', data.session.access_token);
    localStorage.setItem('user_email', email);

    showMessage('Login successful! Redirecting...', 'success');

    setTimeout(() => {
      window.location.href = 'admin/index.html'; // or customer/ based on role logic later
    }, 1200);
  });

  // ────────────────────────────────────────────────
  //                 REGISTER HANDLER
  // ────────────────────────────────────────────────
  document.getElementById('signupFormElement').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupPasswordConfirm').value;

    if (!email || !password) return showMessage('Please fill in all fields', 'error');
    if (password !== confirm) return showMessage('Passwords do not match', 'error');
    if (password.length < 6) return showMessage('Password must be at least 6 characters', 'error');

    showMessage('Creating account...', 'info');

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + '/login.html'
      }
    });

    if (error) {
      showMessage(error.message || 'Registration failed – try another email', 'error');
      console.error('Signup error:', error);
      return;
    }

    if (data.user) {
      showMessage('Account created! You can now log in.', 'success');
      // Switch to login tab automatically
      document.querySelector('.tab[data-form="login"]').click();
    } else {
      showMessage('Check your email to confirm (if required)', 'info');
    }
  });

  console.log("Login/Register script loaded – tabs should now work");
</script>
</body>
</html>
