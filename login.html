  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      border: 1px solid #334155;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; margin-bottom: 1.5rem; }
    .tabs {
      display: flex;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #334155;
    }
    .tab {
      flex: 1;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      border-bottom: 3px solid transparent;
    }
    .tab.active {
      border-bottom: 3px solid #3b82f6;
      color: #3b82f6;
    }
    input {
      width: 100%;
      padding: 0.9rem;
      margin: 0.6rem 0;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 1rem;
      margin-top: 1rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }
    .error { color: #ef4444; }
    .success { color: #22c55e; }
    .back {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>LeadFlow</h1>

  <div class="tabs">
    <div class="tab active" onclick="showForm('login')">Login</div>
    <div class="tab" onclick="showForm('signup')">Register</div>
  </div>

  <!-- Login Form -->
  <form id="loginForm" style="display:block;">
    <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Login</button>
  </form>

  <!-- Signup Form (hidden by default) -->
  <form id="signupForm" style="display:none;">
    <input type="email" id="signupEmail" placeholder="Email" required autocomplete="email">
    <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" required minlength="6" autocomplete="new-password">
    <input type="password" id="signupPasswordConfirm" placeholder="Confirm Password" required minlength="6">
    <button type="submit">Create Account</button>
  </form>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">← Back to home</a>
</div>

<script type="module">
  const messageDiv = document.getElementById('message');

  function showMessage(text, type = 'info') {
    messageDiv.textContent = text;
    messageDiv.className = 'message ' + type;
  }

  function showForm(formType) {
    document.getElementById('loginForm').style.display = formType === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = formType === 'signup' ? 'block' : 'none';

    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelector(`.tab[onclick="showForm('${formType}')"]`).classList.add('active');
    messageDiv.textContent = '';
  }

  // Login handler
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) return showMessage('Please fill in all fields', 'error');

    showMessage('Logging in...', 'info');

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showMessage(error.message || 'Login failed – check email/password', 'error');
      console.error(error);
      return;
    }

    // Success
    localStorage.setItem('access_token', data.session.access_token);
    localStorage.setItem('refresh_token', data.session.refresh_token);
    localStorage.setItem('user_email', email);

    // Simple role logic (you can make it more advanced later)
    // For demo: if email contains "admin" → admin, else customer
    const role = email.includes('admin') ? 'admin' : 'customer';
    localStorage.setItem('role', role);

    showMessage('Login successful! Redirecting...', 'success');

    setTimeout(() => {
      if (role === 'admin') {
        window.location.href = 'admin/index.html';
      } else {
        window.location.href = 'customer/index.html';
      }
    }, 1500);
  });

  // Register handler
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupPasswordConfirm').value;

    if (!email || !password) return showMessage('Please fill in all fields', 'error');
    if (password !== confirm) return showMessage('Passwords do not match', 'error');
    if (password.length < 6) return showMessage('Password must be at least 6 characters', 'error');

    showMessage('Creating account...', 'info');

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo: window.location.origin + '/login.html'  // redirect back after confirmation (if enabled)
      }
    });

    if (error) {
      showMessage(error.message || 'Registration failed – try different email', 'error');
      console.error(error);
      return;
    }

    if (data.user) {
      showMessage('Account created! You can now login.', 'success');
      showForm('login');  // switch to login tab after success
    } else {
      showMessage('Check your email to confirm (if required)', 'info');
    }
  });
</script>
</body>
</html>
