    );

  <style>
    body { font-family:system-ui,sans-serif; background:#0f172a; color:#e2e8f0; margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .container { background:#1e293b; padding:2.5rem; border-radius:12px; width:90%; max-width:420px; border:1px solid #334155; box-shadow:0 10px 30px rgba(0,0,0,0.4); }
    h1 { text-align:center; margin-bottom:1.5rem; }
    .tabs { display:flex; margin-bottom:1.5rem; border-bottom:1px solid #334155; }
    .tab { flex:1; padding:0.8rem; text-align:center; cursor:pointer; font-weight:600; border-bottom:3px solid transparent; }
    .tab.active { border-bottom:3px solid #3b82f6; color:#3b82f6; }
    input { width:100%; padding:0.9rem; margin:0.6rem 0; border-radius:8px; border:1px solid #334155; background:#0f172a; color:white; }
    button { width:100%; padding:1rem; margin-top:1rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; }
    button:hover { background:#2563eb; }
    .message { margin-top:1rem; text-align:center; font-size:0.95rem; min-height:1.2rem; }
    .error { color:#ef4444; }
    .success { color:#22c55e; }
  </style>
</head>
<body>

<div class="container">
  <h1>LeadFlow</h1>

  <div class="tabs">
    <div class="tab active" data-tab="login">Login</div>
    <div class="tab" data-tab="signup">Register</div>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginSection">
    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <!-- REGISTER FORM -->
  <div id="signupSection" style="display:none;">
    <form id="signupForm">
      <input type="email" id="signupEmail" placeholder="Email" required>
      <input type="password" id="signupPassword" placeholder="Password (6+ chars)" required minlength="6">
      <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
      <button type="submit">Create Free Trial Account</button>
    </form>
  </div>

  <div id="message" class="message"></div>
</div>

<script type="module">
  const message = document.getElementById('message');

  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');

      document.getElementById('loginSection').style.display = tab.dataset.tab === 'login' ? 'block' : 'none';
      document.getElementById('signupSection').style.display = tab.dataset.tab === 'signup' ? 'block' : 'none';
      message.textContent = '';
    });
  });

  // Login
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    message.textContent = 'Logging in...';
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      message.className = 'message error';
      message.textContent = error.message;
      return;
    }

    localStorage.setItem('role', 'customer'); // change to 'admin' for testing
    message.className = 'message success';
    message.textContent = 'Welcome back!';
    setTimeout(() => window.location.href = 'customer/index.html', 800);
  });

  // Register + Free Trial Role
  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirm').value;

    if (password !== confirm) return message.textContent = 'Passwords do not match';
    if (password.length < 6) return message.textContent = 'Password must be 6+ characters';

    message.textContent = 'Creating free trial account...';

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { role: 'free_trial' } }
    });

    if (error) {
      message.className = 'message error';
      message.textContent = error.message;
      return;
    }

    message.className = 'message success';
    message.textContent = 'Account created! Free trial activated. Logging you in...';

    localStorage.setItem('role', 'free_trial');
    setTimeout(() => window.location.href = 'customer/index.html', 1200);
  });
</script>
</body>
</html>
